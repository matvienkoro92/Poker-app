          <!-- Переводы -->
          <div class="view" data-view="transfers" id="transfersView">
            <section class="transfers-page" aria-labelledby="transfersTitle">
              <header class="transfers-page__header">
                <button type="button" class="bonus-game-back transfers-page__back" data-view-target="home" aria-label="На главную">←</button>
                <div class="transfers-page__heading">
                  <h1 class="title transfers-page__title" id="transfersTitle">Переводы</h1>
                  <p class="transfers-page__viewer" id="transfersViewerId" hidden></p>
                </div>
              </header>

              <p class="transfers-page__access-note" id="transfersAccessNote">
                Размещать и видеть заявки могут только игроки с уровнем 10+.
              </p>
              <p class="transfers-page__access-locked" id="transfersAccessLocked" hidden></p>

              <form class="transfers-create" id="transfersCreateForm" autocomplete="off" hidden>
                <div class="transfers-create__mode" role="tablist" aria-label="Тип заявки">
                  <button type="button" class="transfers-create__mode-btn transfers-create__mode-btn--active" data-transfers-kind="cashout" aria-pressed="true">
                    <span class="transfers-create__mode-icon" aria-hidden="true">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v4c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/><path d="M5 10v4c0 1.7 3.1 3 7 3s7-1.3 7-3v-4"/><path d="M5 14v4c0 1.7 3.1 3 7 3s7-1.3 7-3v-4"/><path d="M12 4.6v2.8"/><path d="M10.7 5.4h2.6"/></svg>
                    </span>
                    <span>Хочу вывести</span>
                  </button>
                  <button type="button" class="transfers-create__mode-btn" data-transfers-kind="deposit" aria-pressed="false">
                    <span class="transfers-create__mode-icon" aria-hidden="true">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/><path d="M7 15h2"/><path d="M13 15h4"/></svg>
                    </span>
                    <span>Нужны реквизиты</span>
                  </button>
                </div>
                <div class="transfers-create__grid">
                  <label class="transfers-field transfers-field--amount">
                    <span class="transfers-field__label">Сумма</span>
                    <input class="transfers-field__input" id="transfersAmountInput" type="number" min="1" max="2500" step="1" inputmode="numeric" placeholder="до 2500 ₽" required />
                  </label>
                  <label class="transfers-field transfers-field--comment">
                    <span class="transfers-field__label">Комментарий</span>
                    <input class="transfers-field__input" id="transfersCommentInput" type="text" maxlength="240" placeholder="необязательно" />
                  </label>
                </div>
                <label class="transfers-field transfers-field--details" id="transfersDetailsField">
                  <span class="transfers-field__label" id="transfersDetailsLabel">Реквизиты</span>
                  <textarea class="transfers-field__textarea" id="transfersDetailsInput" rows="3" maxlength="700" placeholder="карта, банк, телефон"></textarea>
                </label>
                <div class="transfers-create__actions">
                  <button type="submit" class="transfers-create__submit" id="transfersCreateSubmit">Разместить заявку</button>
                  <span class="transfers-feedback" id="transfersCreateFeedback" aria-live="polite"></span>
                </div>
              </form>

              <div class="transfers-tabs" role="tablist" aria-label="Список заявок" hidden>
                <button type="button" class="transfers-tabs__btn transfers-tabs__btn--active" data-transfers-filter="active" aria-pressed="true">
                  <span class="transfers-tabs__icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></svg>
                  </span>
                  <span>Активные</span>
                </button>
                <button type="button" class="transfers-tabs__btn" data-transfers-filter="mine" aria-pressed="false">
                  <span class="transfers-tabs__icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/></svg>
                  </span>
                  <span>Мои</span>
                </button>
                <button type="button" class="transfers-tabs__btn" data-transfers-filter="completed" aria-pressed="false">
                  <span class="transfers-tabs__icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/><path d="M12 15v2"/></svg>
                  </span>
                  <span>Закрытые</span>
                </button>
              </div>

              <div class="transfers-list" id="transfersList" aria-live="polite" hidden></div>
              <p class="transfers-empty" id="transfersEmpty" hidden>Заявок пока нет.</p>
            </section>
          </div>
