<section class="play-card-layout" aria-label="Турнир вечера и игры клуба">
  <article class="play-card" aria-labelledby="playCardTitle">
    <img class="play-card__portal" src="./assets/play-card/portal-480.webp" srcset="./assets/play-card/portal-480.webp 480w, ./assets/play-card/portal-800.webp 800w" sizes="(min-width:700px) 560px, 96vw" width="800" height="1200" alt="" decoding="async" fetchpriority="high" />
    <header class="play-card__header"><h1 id="playCardTitle">ТУРНИР ВЕЧЕРА</h1><div class="play-card__session"><strong id="tournamentDayHomeName">Мэджик</strong><time data-home-ticket-time>18:00 МСК</time></div></header>
    <img class="play-card__manki" src="./assets/play-card/manki-480.webp" srcset="./assets/play-card/manki-480.webp 480w, ./assets/play-card/manki-800.webp 800w" sizes="(min-width:700px) 230px, 39vw" alt="" decoding="async" />
    <button class="play-card__cooler" type="button" data-play-cooler aria-label="Поговорить с Кулером"><img src="./assets/play-card/cooler-480.webp" srcset="./assets/play-card/cooler-480.webp 480w, ./assets/play-card/cooler-800.webp 800w" sizes="(min-width:700px) 280px, 47vw" width="480" height="720" alt="" decoding="async" /></button>
    <dl class="play-card__terms"><div><dt>Вход</dt><dd id="tournamentDayBuyin">—</dd></div><div><dt>Призы</dt><dd id="tournamentDayGuarantee">—</dd></div></dl>
    <button type="button" class="play-card__play" data-play-next aria-label="Сыграть турнир"><span>СЫГРАТЬ ТУРНИР <b aria-hidden="true">→</b></span></button>
  </article>
  <section class="play-card-games" aria-labelledby="playCardGamesTitle"><h2 id="playCardGamesTitle">ДРУГИЕ ИГРЫ В КЛУБЕ</h2>
    <nav class="play-card-games__grid" aria-label="Игры клуба">
      <button type="button" data-evening-villa-game="billiards" aria-label="Бильярд"><span class="play-card-games__art"><img data-play-art-slot="billiards" src="./assets/play-card/billiards-240.webp" srcset="./assets/play-card/billiards-240.webp 240w, ./assets/play-card/billiards-400.webp 400w" sizes="(min-width:700px) 180px, 31vw" alt="Бильярд" width="240" height="360" loading="lazy" decoding="async" /></span><span class="play-card-games__label">Бильярд</span></button>
      <button type="button" data-evening-villa-game="nards" aria-label="Нарды"><span class="play-card-games__art"><img data-play-art-slot="nards" src="./assets/play-card/nards-240.webp" srcset="./assets/play-card/nards-240.webp 240w, ./assets/play-card/nards-400.webp 400w" sizes="(min-width:700px) 180px, 31vw" alt="Нарды" width="240" height="360" loading="lazy" decoding="async" /></span><span class="play-card-games__label">Нарды</span></button>
      <button type="button" data-evening-villa-game="chess" aria-label="Шахматы"><span class="play-card-games__art"><img data-play-art-slot="chess" src="./assets/play-card/chess-240.webp" srcset="./assets/play-card/chess-240.webp 240w, ./assets/play-card/chess-400.webp 400w" sizes="(min-width:700px) 180px, 31vw" alt="Шахматы" width="240" height="360" loading="lazy" decoding="async" /></span><span class="play-card-games__label">Шахматы</span></button>
    </nav>
  </section>
  <span id="tournamentDayTimer" hidden></span><span id="tournamentDayTimerLabel" hidden></span>
  <nav class="play-card-extras" aria-label="Ещё о турнире"><button type="button" id="homeTournamentHistoryOpen" hidden><span data-home-tournament-history-label>Победители</span></button><button type="button" data-tournament-bet-open>Ласт-лонгер</button><button type="button" id="homeTournamentShareBtn">Позвать друга</button></nav>
</section>
