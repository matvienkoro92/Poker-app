<div class="view" data-view="daily-poker">
  <section class="daily-poker" aria-labelledby="dailyPokerTitle">
    <div class="daily-poker__feature">
      <header class="daily-poker__header">
        <button type="button" class="bonus-game-back daily-poker__back" data-view-target="home" aria-label="На главную">←</button>
        <img class="daily-poker__hero-monkey" src="./assets/daily-poker-monkey.webp?v=3.319" alt="" loading="eager" decoding="async" aria-hidden="true" />
        <div class="daily-poker__heading">
          <p class="daily-poker__eyebrow">Daily Poker Deal</p>
          <h2 class="daily-poker__title" id="dailyPokerTitle">Раздача дня</h2>
        </div>
      </header>

      <div class="daily-poker__intro">
        <div class="daily-poker__balance" id="dailyPokerBalance">
          <span class="daily-poker__balance-label">Бонусный баланс:</span>
          <strong>—</strong>
        </div>
        <h3 class="daily-poker__intro-title"><span>Соберите комбинацию из списка ниже</span><span>и выиграйте беккинг-билет.</span></h3>
        <p class="daily-poker__intro-subtitle">Вам доступна 1&nbsp;бесплатная раздача раз в 24 часа.</p>
        <ul class="daily-poker__prizes" aria-label="Призы за комбинации">
          <li class="daily-poker__prize daily-poker__prize--royal" aria-label="Роял-флеш, билет за 10 000 рублей">
            <img class="daily-poker__prize-art" src="./assets/daily-poker-prize-royal.webp?v=3.401" alt="" loading="lazy" decoding="async" aria-hidden="true" />
          </li>
          <li class="daily-poker__prize daily-poker__prize--straight-flush" aria-label="Стрит-флеш, билет за 3 000 рублей">
            <img class="daily-poker__prize-art" src="./assets/daily-poker-prize-straight-flush.webp?v=3.402" alt="" loading="lazy" decoding="async" aria-hidden="true" />
          </li>
          <li class="daily-poker__prize daily-poker__prize--quads" aria-label="Каре, билет за 1 200 рублей">
            <img class="daily-poker__prize-art" src="./assets/daily-poker-prize-quads.webp?v=3.401" alt="" loading="lazy" decoding="async" aria-hidden="true" />
          </li>
          <li class="daily-poker__prize" aria-label="Фулл-хаус, билет за 500 рублей">
            <img class="daily-poker__prize-art" src="./assets/daily-poker-prize-full-house.webp?v=3.401" alt="" loading="lazy" decoding="async" aria-hidden="true" />
          </li>
          <li class="daily-poker__prize daily-poker__prize--bonus-extra" aria-label="Флеш или стрит, 50 рублей бонус и дополнительная попытка">
            <img class="daily-poker__prize-art" src="./assets/daily-poker-prize-flush-straight.webp?v=3.401" alt="" loading="lazy" decoding="async" aria-hidden="true" />
          </li>
          <li class="daily-poker__prize" aria-label="Сет, дополнительная попытка">
            <img class="daily-poker__prize-art" src="./assets/daily-poker-prize-set.webp?v=3.401" alt="" loading="lazy" decoding="async" aria-hidden="true" />
          </li>
        </ul>
      </div>
    </div>

    <div class="daily-poker__table" aria-live="polite">
      <div class="daily-poker__zone daily-poker__zone--hole">
        <div class="daily-poker__zone-label">Твои карты</div>
        <div class="daily-poker__cards daily-poker__cards--hole" id="dailyPokerHoleCards"></div>
      </div>
      <div class="daily-poker__zone daily-poker__zone--board">
        <div class="daily-poker__zone-label">Борд</div>
        <div class="daily-poker__cards daily-poker__cards--board" id="dailyPokerBoardCards"></div>
      </div>
    </div>

    <div class="daily-poker__result" id="dailyPokerResult" aria-live="polite" hidden></div>
    <div class="daily-poker__reward" id="dailyPokerReward" aria-live="off" aria-hidden="true" hidden></div>

    <div class="daily-poker__actions">
      <button type="button" class="daily-poker__play-btn" id="dailyPokerPlayBtn">Раздать карты</button>
      <button type="button" class="daily-poker__play-btn daily-poker__play-btn--extra" id="dailyPokerExtraBtn" hidden>Раздать карты</button>
      <div class="daily-poker__share-actions">
        <button type="button" class="daily-poker__invite-btn" id="dailyPokerInviteBtn">Позвать друга</button>
        <button type="button" class="daily-poker__copy-btn" id="dailyPokerCopyLinkBtn" aria-label="Скопировать ссылку на Раздачу дня" title="Скопировать ссылку">
          <span class="daily-poker__copy-icon" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
          </span>
        </button>
      </div>
    </div>

    <section class="daily-poker__winners" aria-labelledby="dailyPokerWinnersTitle">
      <div class="daily-poker__winners-head">
        <h3 id="dailyPokerWinnersTitle">Уже выиграли</h3>
        <span id="dailyPokerWinnersMeta">За всё время</span>
      </div>
      <div class="daily-poker__winners-list" id="dailyPokerWinnersList" aria-live="polite">
        <div class="daily-poker__winners-empty">Загружаем победителей…</div>
      </div>
      <div class="daily-poker__spin-stats" id="dailyPokerSpinStats" aria-live="polite" hidden></div>
    </section>
  </section>
</div>
