<div class="view" data-view="daily-poker">
  <section class="daily-poker" aria-labelledby="dailyPokerTitle">
    <header class="daily-poker__header">
      <button type="button" class="bonus-game-back daily-poker__back" data-view-target="home" aria-label="На главную">←</button>
      <img class="daily-poker__hero-monkey" src="./assets/daily-poker-monkey.webp?v=3.319" alt="" loading="eager" decoding="async" aria-hidden="true" />
      <div class="daily-poker__heading">
        <p class="daily-poker__eyebrow">Daily Poker Deal</p>
        <h2 class="daily-poker__title" id="dailyPokerTitle">Раздача дня</h2>
      </div>
    </header>

    <div class="daily-poker__intro">
      <div class="daily-poker__balance" id="dailyPokerBalance">
        <span class="daily-poker__balance-label">Бонусный баланс:</span>
        <strong>—</strong>
      </div>
      <p>Вам доступна 1 бесплатная раздача раз в 24 часа. Соберите комбинацию из списка ниже и выиграйте билет на турнир.</p>
      <ul class="daily-poker__prizes" aria-label="Призы за комбинации">
        <li class="daily-poker__prize daily-poker__prize--royal" aria-label="Роял-флеш, билет 10 000 рублей, Нокаут за 10 000 рублей">
          <img src="./assets/daily-poker-prize-royal.webp?v=3.319" alt="" loading="lazy" decoding="async" aria-hidden="true" />
        </li>
        <li class="daily-poker__prize" aria-label="Стрит-флеш, билет 3 000 рублей, турнир за 3 000 рублей из расписания">
          <img src="./assets/daily-poker-prize-straight-flush.webp?v=3.319" alt="" loading="lazy" decoding="async" aria-hidden="true" />
        </li>
        <li class="daily-poker__prize" aria-label="Каре, билет 1 200 рублей, Нокаут Мистери в четверг, 18:00 МСК">
          <img src="./assets/daily-poker-prize-quads.webp?v=3.319" alt="" loading="lazy" decoding="async" aria-hidden="true" />
        </li>
        <li class="daily-poker__prize" aria-label="Фулл-хаус, билет 500 рублей, любой турнир за 500 рублей из расписания">
          <img src="./assets/daily-poker-prize-full-house.webp?v=3.319" alt="" loading="lazy" decoding="async" aria-hidden="true" />
        </li>
        <li class="daily-poker__prize" aria-label="Флеш или стрит, 50 бонусов и дополнительная попытка">
          <img src="./assets/daily-poker-prize-flush-straight.webp?v=3.319" alt="" loading="lazy" decoding="async" aria-hidden="true" />
        </li>
        <li class="daily-poker__prize" aria-label="Сет, дополнительная попытка">
          <img src="./assets/daily-poker-prize-set.webp?v=3.319" alt="" loading="lazy" decoding="async" aria-hidden="true" />
        </li>
      </ul>
    </div>

    <div class="daily-poker__status-row">
      <div class="daily-poker__timer" id="dailyPokerTimer">Проверяем доступность раздачи…</div>
      <div class="daily-poker__attempts" id="dailyPokerAttempts">Попытки: —</div>
    </div>

    <div class="daily-poker__table" aria-live="polite">
      <div class="daily-poker__zone daily-poker__zone--hole">
        <div class="daily-poker__zone-label">Твои карты</div>
        <div class="daily-poker__cards daily-poker__cards--hole" id="dailyPokerHoleCards"></div>
      </div>
      <div class="daily-poker__zone daily-poker__zone--board" hidden>
        <div class="daily-poker__zone-label">Борд</div>
        <div class="daily-poker__cards daily-poker__cards--board" id="dailyPokerBoardCards"></div>
      </div>
    </div>

    <div class="daily-poker__actions">
      <button type="button" class="daily-poker__play-btn" id="dailyPokerPlayBtn">Играть</button>
      <button type="button" class="daily-poker__play-btn daily-poker__play-btn--extra" id="dailyPokerExtraBtn" hidden>Сыграть дополнительную попытку</button>
      <button type="button" class="daily-poker__claim-btn" id="dailyPokerClaimBtn" hidden>Забрать приз</button>
    </div>

    <div class="daily-poker__result" id="dailyPokerResult" aria-live="polite" hidden></div>
    <div class="daily-poker__reward" id="dailyPokerReward" aria-live="polite" hidden></div>
    <div class="daily-poker__ticketless-streak" id="dailyPokerTicketlessStreak" aria-live="polite">Серия без билета: —</div>
  </section>
</div>
