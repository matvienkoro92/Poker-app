<div class="view" data-view="player-crm" id="playerCrmView">
  <button type="button" class="bonus-game-back" data-view-target="home" aria-label="На главную">←</button>
  <section class="player-crm" aria-labelledby="playerCrmTitle">
    <header class="player-crm__hero">
      <div class="player-crm__hero-copy">
        <h2 class="player-crm__title" id="playerCrmTitle">CRM</h2>
      </div>
      <div class="player-crm__hero-tools">
        <label class="player-crm__period">
          <span>Период</span>
          <select id="playerCrmPeriodSelect">
            <option value="7">7 дней</option>
            <option value="30" selected>30 дней</option>
            <option value="90">90 дней</option>
            <option value="custom">Даты</option>
          </select>
        </label>
        <label class="player-crm__period player-crm__date-field">
          <span>С</span>
          <span class="player-crm__date-control">
            <input id="playerCrmDateFrom" type="date" inputmode="none" />
            <button type="button" class="player-crm__date-picker-btn" data-crm-date-picker="playerCrmDateFrom" aria-label="Выбрать дату начала">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M7 3v3M17 3v3M4 9h16M6 5h12a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z"></path>
              </svg>
            </button>
          </span>
        </label>
        <label class="player-crm__period player-crm__date-field">
          <span>По</span>
          <span class="player-crm__date-control">
            <input id="playerCrmDateTo" type="date" inputmode="none" />
            <button type="button" class="player-crm__date-picker-btn" data-crm-date-picker="playerCrmDateTo" aria-label="Выбрать дату окончания">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M7 3v3M17 3v3M4 9h16M6 5h12a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z"></path>
              </svg>
            </button>
          </span>
        </label>
        <button type="button" class="player-crm__ghost-btn" id="playerCrmRefreshBtn">Обновить</button>
      </div>
    </header>

    <div class="player-crm__stats" id="playerCrmStats"></div>

    <div class="player-crm__tabs-title">Разделы</div>
    <nav class="player-crm__tabs" aria-label="CRM разделы">
      <button type="button" class="player-crm__tab player-crm__tab--active" data-crm-tab="overview">Обзор</button>
      <button type="button" class="player-crm__tab" data-crm-tab="players">Игроки</button>
      <button type="button" class="player-crm__tab" data-crm-tab="registrations">Регистрации</button>
      <button type="button" class="player-crm__tab" data-crm-tab="pokerplus">Poker21</button>
      <button type="button" class="player-crm__tab" data-crm-tab="segments">Сегменты</button>
      <button type="button" class="player-crm__tab" data-crm-tab="broadcast">Рассылки</button>
    </nav>

    <div class="player-crm__workbench">
      <main class="player-crm__panel player-crm__panel--main">
        <section class="player-crm__tab-panel player-crm__tab-panel--active" data-crm-panel="overview">
          <div class="player-crm__section-head">
            <h3>Обзор</h3>
            <span id="playerCrmAnalyticsPeriod">30 дней</span>
          </div>
          <div class="player-crm__analytics" id="playerCrmAnalytics"></div>
        </section>

        <section class="player-crm__tab-panel" data-crm-panel="players">
          <div class="player-crm__section-head">
            <h3>Игроки</h3>
            <span>по 15 в списке</span>
          </div>
          <div class="player-crm__players-grid">
            <aside class="player-crm__players-list">
              <div class="player-crm__filters">
                <input type="search" class="player-crm__search" id="playerCrmSearch" placeholder="Поиск: ник, тег, источник" autocomplete="off" />
                <div class="player-crm__chips" id="playerCrmFilterChips"></div>
              </div>
              <div class="player-crm__list" id="playerCrmList" aria-live="polite"></div>
            </aside>
            <section class="player-crm__player-card">
              <div class="player-crm__section-head">
                <h3>Карточка игрока</h3>
                <span id="playerCrmSelectedHint">—</span>
              </div>
              <div class="player-crm__detail" id="playerCrmDetail"></div>
            </section>
          </div>
        </section>

        <section class="player-crm__tab-panel" data-crm-panel="registrations">
          <div class="player-crm__section-head">
            <h3>Зарегистрированные</h3>
            <span>почта и Telegram-бот</span>
          </div>
          <div class="player-crm__form-grid player-crm__registration-filters">
            <label>
              <span>Показать</span>
              <select id="playerCrmRegistrationMethod">
                <option value="all">Все</option>
                <option value="email">Почта</option>
                <option value="telegram">Telegram-бот</option>
              </select>
            </label>
            <label>
              <span>Сортировать</span>
              <select id="playerCrmRegistrationSort">
                <option value="name">Имя</option>
                <option value="email">Email</option>
                <option value="telegram">Telegram-логин</option>
                <option value="method">Способ</option>
              </select>
            </label>
          </div>
          <div class="player-crm__registrations" id="playerCrmRegistrations"></div>
        </section>

        <section class="player-crm__tab-panel" data-crm-panel="pokerplus">
          <div class="player-crm__section-head">
            <h3>Poker21</h3>
            <span>подтверждённые аккаунты</span>
          </div>
          <div class="player-crm__form-grid player-crm__pokerplus-filters">
            <label>
              <span>Уровень от</span>
              <input id="playerCrmPokerLevelMin" type="number" inputmode="numeric" min="1" max="55" placeholder="1" />
            </label>
            <label>
              <span>Уровень до</span>
              <input id="playerCrmPokerLevelMax" type="number" inputmode="numeric" min="1" max="55" placeholder="55" />
            </label>
            <label>
              <span>Привязка с</span>
              <input id="playerCrmPokerDateFrom" type="date" inputmode="none" />
            </label>
            <label>
              <span>Привязка по</span>
              <input id="playerCrmPokerDateTo" type="date" inputmode="none" />
            </label>
          </div>
          <div class="player-crm__pokerplus" id="playerCrmPokerPlusAccounts"></div>
        </section>

        <section class="player-crm__tab-panel" data-crm-panel="segments">
          <div class="player-crm__section-head">
            <h3>Сегменты</h3>
            <span>авто-группы по активности</span>
          </div>
          <div class="player-crm__segments" id="playerCrmSegments"></div>
        </section>

        <section class="player-crm__tab-panel" data-crm-panel="broadcast">
          <div class="player-crm__section-head">
            <h3>Рассылка</h3>
            <span id="playerCrmBroadcastAudience">—</span>
          </div>
          <div class="player-crm__broadcast">
            <div class="player-crm__form-grid">
              <label>
                <span>Группа</span>
                <select id="playerCrmBroadcastSegment"></select>
              </label>
              <label>
                <span>Канал</span>
                <select id="playerCrmBroadcastChannel">
                  <option value="bot">Бот</option>
                  <option value="push">Push</option>
                  <option value="bot_push">Бот + push</option>
                </select>
              </label>
            </div>
            <label class="player-crm__message-label">
              <span>Сообщение</span>
              <textarea id="playerCrmBroadcastText" rows="6" maxlength="900">Сегодня есть хорошие столы и турнирный движ. Если хочешь зайти, напиши менеджеру — подберём игру по лимиту.</textarea>
            </label>
            <div class="player-crm__broadcast-actions">
              <button type="button" class="player-crm__primary-btn" id="playerCrmBroadcastPrepareBtn">Подготовить рассылку</button>
              <button type="button" class="player-crm__danger-btn" id="playerCrmBroadcastSendBtn">Отправить сейчас</button>
              <button type="button" class="player-crm__ghost-btn" id="playerCrmBroadcastPreviewBtn">Пересчитать</button>
            </div>
            <div class="player-crm__send-result" id="playerCrmBroadcastResult" aria-live="polite"></div>
          </div>
        </section>
      </main>
    </div>

    <div class="player-crm__dialog-modal" id="playerCrmManagerDialogModal" hidden>
      <div class="player-crm__dialog-modal-backdrop" data-crm-close-dialog-modal></div>
      <section class="player-crm__dialog-modal-panel" aria-modal="true" role="dialog" aria-labelledby="playerCrmManagerDialogTitle">
        <div class="player-crm__dialog-modal-head">
          <div>
            <h3 id="playerCrmManagerDialogTitle">Диалоги</h3>
            <span id="playerCrmManagerDialogSubtitle">—</span>
          </div>
          <button type="button" class="player-crm__dialog-modal-close" data-crm-close-dialog-modal aria-label="Закрыть">×</button>
        </div>
        <div class="player-crm__dialog-modal-body" id="playerCrmManagerDialogBody"></div>
      </section>
    </div>
  </section>
</div>
