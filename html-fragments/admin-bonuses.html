<div class="view" data-view="admin-bonuses">
  <section class="admin-bonuses" aria-labelledby="adminBonusesTitle">
    <header class="admin-bonuses__header">
      <button type="button" class="bonus-game-back admin-bonuses__back" data-view-target="home" aria-label="На главную">←</button>
      <div class="admin-bonuses__heading">
        <p class="admin-bonuses__eyebrow">Админка</p>
        <h2 class="admin-bonuses__title" id="adminBonusesTitle">Бонусные балансы</h2>
      </div>
      <button type="button" class="admin-bonuses__refresh" id="adminBonusesRefreshBtn">Обновить</button>
    </header>

    <div class="admin-bonuses__tabs" role="tablist" aria-label="Раздел бонусных балансов">
      <button type="button" class="admin-bonuses__tab admin-bonuses__tab--active" data-admin-bonuses-tab="balances" role="tab" aria-selected="true">Балансы</button>
      <button type="button" class="admin-bonuses__tab" data-admin-bonuses-tab="issues" role="tab" aria-selected="false">Кому выдано</button>
    </div>

    <div class="admin-bonuses__tab-panel" data-admin-bonuses-panel="balances">
    <div class="admin-bonuses__filters">
      <input type="search" id="adminBonusesSearch" class="admin-bonuses__input" placeholder="id / nickname / email / phone" autocomplete="off" />
      <input type="number" id="adminBonusesMinBalance" class="admin-bonuses__input" placeholder="Баланс от" inputmode="numeric" min="0" />
      <input type="number" id="adminBonusesMaxBalance" class="admin-bonuses__input" placeholder="Баланс до" inputmode="numeric" min="0" />
      <select id="adminBonusesSort" class="admin-bonuses__input">
        <option value="bonus_balance_desc">Баланс ↓</option>
        <option value="bonus_balance_asc">Баланс ↑</option>
        <option value="last_game_desc">Последняя игра</option>
        <option value="games_desc">Раздачи</option>
        <option value="tickets_desc">Билеты</option>
        <option value="user_id">User ID</option>
      </select>
    </div>

    <div class="admin-bonuses__notice" id="adminBonusesStatus">Загрузка…</div>

    <div class="admin-bonuses__table-wrap">
      <table class="admin-bonuses__table">
        <thead>
          <tr>
            <th>Польз.</th>
            <th>Действия</th>
            <th>Баланс</th>
            <th>Разд.</th>
            <th>Бил.</th>
          </tr>
        </thead>
        <tbody id="adminBonusesTableBody"></tbody>
      </table>
    </div>
    <div class="admin-bonuses__show-all-row" hidden>
      <button type="button" class="admin-bonuses__show-all" id="adminBonusesShowAllBtn" hidden>Показать всех</button>
    </div>
    <div class="admin-bonuses__totals">
      <div class="admin-bonuses__total-debited" id="adminBonusesTotalDebited" hidden>
        <span>Итого списано</span>
        <strong id="adminBonusesTotalDebitedValue">0</strong>
      </div>
      <div class="admin-bonuses__total-debited admin-bonuses__total-balance" id="adminBonusesTotalBalance" hidden>
        <span>Итого на балансах</span>
        <strong id="adminBonusesTotalBalanceValue">0</strong>
      </div>
    </div>

    </div>

    <section class="admin-bonuses__tab-panel admin-bonuses__issues" data-admin-bonuses-panel="issues" hidden>
      <div class="admin-bonuses__issues-head">
        <div>
          <h3>Кому выдано</h3>
          <p>Списания сгруппированы по отчётным суткам с 06:00 МСК.</p>
          <div class="admin-bonuses__issues-week-total">
            <span>Выдано за текущую неделю</span>
            <strong id="adminBonusesIssuesWeekTotal">0</strong>
          </div>
        </div>
        <button type="button" class="admin-bonuses__refresh" id="adminBonusesIssuesRefreshBtn">Обновить</button>
      </div>
      <div class="admin-bonuses__issues-body" id="adminBonusesIssuesBody">Откройте вкладку, чтобы загрузить выдачи.</div>
      <div class="admin-bonuses__issues-week-return">
        <span>Возврат за текущую неделю</span>
        <strong id="adminBonusesIssuesWeekReturn">+0</strong>
      </div>
    </section>
  </section>

  <div class="admin-bonuses-modal" id="adminBonusesOperationModal" role="dialog" aria-modal="true" aria-labelledby="adminBonusesOperationTitle" aria-hidden="true" hidden>
    <div class="admin-bonuses-modal__backdrop" id="adminBonusesOperationBackdrop"></div>
    <section class="admin-bonuses-modal__panel">
      <button type="button" class="admin-bonuses-modal__close" id="adminBonusesOperationClose" aria-label="Закрыть">×</button>
      <h3 id="adminBonusesOperationTitle">Операция</h3>
      <p class="admin-bonuses-modal__user" id="adminBonusesOperationUser">—</p>
      <label class="admin-bonuses-modal__label" id="adminBonusesOperationTournamentWrap" hidden>
        <span>Турнир из расписания</span>
        <select id="adminBonusesOperationTournament" required>
          <option value="">Выберите турнир</option>
        </select>
      </label>
      <label class="admin-bonuses-modal__label">
        <span>Сумма</span>
        <input type="number" id="adminBonusesOperationAmount" min="1" inputmode="numeric" />
      </label>
      <label class="admin-bonuses-modal__label">
        <span>Комментарий</span>
        <textarea id="adminBonusesOperationComment" rows="3" maxlength="500"></textarea>
      </label>
      <button type="button" class="admin-bonuses-modal__confirm" id="adminBonusesOperationConfirm">Подтвердить</button>
      <p class="admin-bonuses-modal__message" id="adminBonusesOperationMessage" aria-live="polite"></p>
    </section>
  </div>
</div>
