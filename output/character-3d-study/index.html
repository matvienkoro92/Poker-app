<!doctype html><html lang="ru"><meta charset="utf-8"><base href="../../"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Покерманки — объёмная версия</title><style>body{margin:0;background:#0c171d;color:#ffe1a0;font:16px system-ui}main{max-width:900px;margin:auto;padding:20px}.views{display:grid;grid-template-columns:1fr 1fr;gap:12px}.view{height:65vh;min-height:380px;border:1px solid #ac874b55;border-radius:24px;background:radial-gradient(ellipse,#22352e,#0c171d);overflow:hidden}.view img{width:100%;height:100%;object-fit:contain}.view canvas{display:block;width:100%;height:100%}#model{touch-action:none;cursor:grab}button{padding:12px;margin:6px;background:#d8b86b;color:#18211b;border:0;border-radius:8px}p{color:#bac9c9;font-size:14px}@media(max-width:600px){.views{grid-template-columns:1fr}.view{height:65vh}}</style><main><h2>Покерманки · объёмная версия</h2><p>Слева — оригинал, справа — объёмная реконструкция с вращением на 360°. Лицо и передняя часть одежды взяты из оригинала; профиль и спина восстановлены по нему.</p><div class="views"><div class="view"><img src="assets/player-hall/standing-monkey-v1.webp" alt="Оригинальный персонаж"></div><div class="view" id="model" tabindex="0" aria-label="Потяните для вращения 3D-прототипа"></div></div><button data-angle="0">Спереди</button><button data-angle="0.65">¾</button><button data-angle="1.5708">Профиль</button><button data-angle="3.14159">Спина</button><button id="spin" aria-pressed="false">Автоповорот</button><p id="status">Подготовка объёма…</p></main><script src="app-garage-catalog.js"></script><script type="module">import {createCharacterStudy} from './scripts/garage-3d/character-reconstruction.mjs';try{window.study=await createCharacterStudy(document.querySelector('#model'),PokerGarage.defaults);const original=document.querySelector('.view img');await original.decode();original.src=PokerGarage.renderCharacter(original,PokerGarage.defaults).toDataURL();document.querySelector('#status').textContent='Вращайте пальцем или мышью; также работают стрелки клавиатуры.';document.querySelector('#spin').onclick=e=>{const active=e.target.getAttribute('aria-pressed')!=='true';e.target.setAttribute('aria-pressed',String(active));study.setAutoRotate(active);};document.querySelectorAll('[data-angle]').forEach(b=>b.onclick=()=>study.setYaw(Number(b.dataset.angle)));}catch(e){document.querySelector('#status').textContent=e.message;throw e;}</script></html>
