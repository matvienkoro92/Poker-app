<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Два туза: последний бай-ин</title><style>
*{box-sizing:border-box}body{margin:0;background:#070d13;color:#ffe6b1;font-family:Arial,sans-serif}button,a{font:inherit}button{cursor:pointer;color:inherit;border:1px solid #a57a42;border-radius:12px;background:#162535;padding:13px 18px;min-height:48px}button:focus-visible,a:focus-visible{outline:3px solid #6ce7ff}main{max-width:620px;margin:auto;padding:calc(15px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom))}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px}small{letter-spacing:.16em;font-size:10px;color:#ba9970}h1{font-size:26px;margin:6px 0}h2{font-size:26px;line-height:1.1;margin:8px 0 12px}p{font-size:16px;line-height:1.5;margin:10px 0}.scene{position:relative;height:clamp(280px,48svh,440px);overflow:hidden;border:1px solid #8b693c;border-radius:18px;background:#0e1723}.room{position:absolute;inset:-4%;background:url('assets/evening-two-aces-room-v2.webp') center/cover;animation:camera 9s ease-in-out infinite alternate}.shade{position:absolute;inset:0;background:linear-gradient(#040b1499,#040b1422 45%,#040b14cc)}.hero{position:absolute;bottom:0;left:21%;height:90%;max-width:90%;object-fit:contain;filter:drop-shadow(0 10px 10px #0009);animation:hero 5s ease-in-out infinite}.partner{left:52%;height:72%;max-width:48%;animation-delay:-2s}.badge{position:absolute;left:15px;top:15px;padding:9px 12px;background:#071421d9;border:1px solid #b88346;border-radius:8px;font-size:12px}.seal{position:absolute;left:-8%;top:43%;width:116%;padding:15px;background:#e1aa3c;color:#271509;text-align:center;font-size:25px;letter-spacing:.18em;font-weight:900;transform:rotate(-12deg);box-shadow:0 7px 24px #0008;animation:stamp .45s both}.beacon{position:absolute;inset:0;background:linear-gradient(90deg,#ff254633,transparent,#16acff33);animation:beacon 2s ease-in-out infinite alternate}.road{position:absolute;inset:65% 0 0;background:repeating-linear-gradient(90deg,#293544 0 65px,#8292a4 66px 72px,#293544 73px 130px);animation:road 1.2s linear infinite}.race .hero{height:78%;left:6%;bottom:1%;animation:ride 1s ease-in-out infinite}.phone{position:absolute;bottom:20px;right:18px;max-width:65%;padding:14px;background:#102b3fee;border:1px solid #5ba6c4;border-radius:12px;font-size:14px;line-height:1.4;animation:stamp .5s both}.caption{min-height:185px;padding:15px 2px}.speaker{color:#78dbef;font-size:12px;font-weight:bold;text-transform:uppercase;letter-spacing:.1em}.actions{display:flex;gap:10px}.actions button{flex:1}.primary{background:#eeb248;color:#281a09;font-weight:bold}.progress{display:flex;gap:5px;margin:14px 0}.progress i{height:3px;background:#273646;flex:1}.progress i.on{background:#eeb248}.chapters{display:grid;gap:10px}.chapter{padding:15px;border:1px solid #334354;border-radius:12px;background:#101c29}.chapter b{display:block;margin-bottom:5px}.chapter span{font-size:13px;color:#b0bdc9}.chapter button{margin-top:12px;width:100%}.crew{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.crew span{padding:6px 9px;border:1px solid #635239;border-radius:20px;font-size:12px}iframe{width:100%;height:calc(100svh - 110px);border:0;border-radius:14px}[hidden]{display:none!important}@keyframes camera{to{transform:scale(1.07) translateX(-1%)}}@keyframes hero{50%{transform:translateY(-5px) rotate(.6deg)}}@keyframes ride{50%{transform:translateY(-4px) rotate(-1deg)}}@keyframes stamp{from{opacity:0;scale:1.2}to{opacity:1;scale:1}}@keyframes beacon{to{opacity:.15}}@keyframes road{to{background-position:-130px 0}}@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
main:has(#play:not([hidden]))>header{display:none}.arcade-hud{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 0}.arcade-hud b{font-size:13px}.arcade-arena{position:relative;border:1px solid #a17940;border-radius:15px;overflow:hidden}.arcade-arena canvas{width:100%;display:block;touch-action:none;max-height:calc(100svh - 265px);aspect-ratio:390/540}.arcade-overlay{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:22px;background:#071525ee}.arcade-overlay button{margin:5px 0}.arcade-move,.arcade-actions{display:flex;gap:6px;margin:10px 0}.arcade-move button,.arcade-actions button{flex:1;touch-action:none;user-select:none;-webkit-user-select:none;padding:12px 4px;font-size:12px}.arcade-move button:last-child{flex:2;background:#dfa440;color:#1b130b}.arcade-help{font-size:13px;color:#bbcad4}.chapter.completed{border-color:#9aa55b}.medals{color:#f0c25b;font-size:12px;margin-top:8px}
</style></head><body><main><header><div><small>СЮЖЕТНАЯ АРКАДА КЛУБА</small><h1>Последний бай-ин</h1></div><button id="skip">К главам</button></header><section id="intro"><div class="scene" id="scene" aria-hidden="true"></div><div class="progress" id="progress"></div><div class="caption" aria-live="polite"><div class="speaker" id="speaker"></div><h2 id="title"></h2><p id="text"></p></div><div class="actions"><button id="prev">← Назад</button><button class="primary" id="next">Дальше →</button></div></section><section id="map" hidden><small>КОМАНДА СОБИРАЕТСЯ</small><h2>Вернуть банкролл.<br>Успеть на турнир.</h2><div class="crew"><span>ПокерМанки</span><span>Кулер</span><span>Рома</span><span>Мисслик</span><span>Эмиль</span><span>Ваар</span></div><div class="chapters" id="chapters"></div><button id="replay" style="margin-top:15px;width:100%">Посмотреть вступление ещё раз</button></section><section id="play" hidden><button id="leave">← К главам</button><p style="font-size:12px" id="chapterLabel"></p><div id="arcadeRoot"></div></section></main><script>
const $=id=>document.getElementById(id),assets={man:'assets/monkey-race/pokermanki-table-v1.webp',nit:'assets/monkey-race/police-monkey-v1.webp',cool:'assets/cooler-flight/cooler-scene-greeting-v1.webp',roma:'assets/evening-roma-v2.webp',miss:'assets/evening-missclick-v2.webp',emil:'assets/summer-rating-player-emil.webp',vaar:'assets/summer-rating-player-waaar.webp'};
const scenes=[
{speaker:'За час до турнира',title:'Клуб закрыт.',text:'Инспектор Нит забрал билеты и призовой фонд. «Покер запрещён! Домино согласовано». Но вечер только начинается.',hero:'nit',seal:true,badge:'17:00 · КЛУБ «ДВА ТУЗА»'},
{speaker:'ПокерМанки',title:'Надо предупредить наших!',text:'Манки заводит турбину покерного стола и мчит к клубу. За спиной уже слышны сирены: «Ваш диапазон и документы!»',hero:'man',race:true,badge:'ГЛАВА 1 · НОЧНАЯ ПОГОНЯ'},
{speaker:'Кулер',title:'Собираем команду.',text:'«Рома, открывай клуб. Мисслик, найди другой вход. Манки, держись — мы уже идём!» Кулер собирается вернуть банкролл и билеты.',hero:'cool',phone:'ПокерМанки: Они увезли всё. Я еду к вам.',badge:'ОДИН КЛУБ · ОДНА КОМАНДА'},
{speaker:'Эмиль',title:'У меня есть приглашение.',text:'«Нит проводит свой турнир. С нашим призовым фондом. Я зайду через главный вход — и задержу его за финальным столом».',hero:'emil',phone:'Приглашение: закрытый турнир. Организатор — Нит.',badge:'ЭМИЛЬ · НА НАШЕЙ СТОРОНЕ'},
{speaker:'Ваар',title:'Банкролл сам не вернётся.',text:'«Вы отвлекайте охрану. Я найду, куда увезли сейф». Ваар берёт маршрут перевозки. Теперь у команды есть план.',hero:'vaar',badge:'ВААР · НА НАШЕЙ СТОРОНЕ'},
{speaker:'ПокерМанки и Кулер',title:'На последнюю регистрацию!',text:'Манки жмёт газ. Кулер выходит на связь: «Доедь до клуба. А дальше разберёмся. Игру-то понимать надо!»',hero:'man',partner:'cool',race:true,badge:'ДВА ТУЗА: ПОСЛЕДНИЙ БАЙ-ИН'}];
let page=0;function show(){const s=scenes[page];$('scene').className='scene'+(s.race?' race':'');$('scene').innerHTML='<div class="room"></div><div class="shade"></div>'+(s.race?'<div class="road"></div><div class="beacon"></div>':'')+'<img class="hero" src="'+assets[s.hero]+'">'+(s.partner?'<img class="hero partner" src="'+assets[s.partner]+'">':'')+'<div class="badge">'+s.badge+'</div>'+(s.seal?'<div class="seal">ОПЕЧАТАНО</div>':'')+(s.phone?'<div class="phone">'+s.phone+'</div>':'');$('speaker').textContent=s.speaker;$('title').textContent=s.title;$('text').textContent=s.text;$('progress').innerHTML=scenes.map((_,i)=>'<i class="'+(i<=page?'on':'')+'"></i>').join('');$('prev').disabled=page===0;$('next').textContent=page===scenes.length-1?'К первой главе →':'Дальше →';}
</script><script src="app-monkey-race-engine.js?v=5"></script><script src="app-last-buy-in-engine.js?v=1"></script><script src="app-last-buy-in-game.js?v=1"></script><script src="app-last-buy-in-story.js?v=1"></script></body></html>
