<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>Статистика ссылок</title><link rel="stylesheet" href="./styles-link-stats.css?v=20261123-budget-split"></head><body><main><header><div><small>Статистика категории · только просмотр</small><h1 id="category">Загрузка…</h1><p id="recipient"></p></div><button id="refresh" type="button">Обновить</button></header><p id="status" role="status"></p><div class="toolbar"><label>Период (МСК)<select id="period"><option value="all">За всё время</option><option value="today">Сегодня</option><option value="7">Последние 7 дней</option><option value="30">Последние 30 дней</option><option value="month">Календарный месяц</option><option value="range">Диапазон дат</option></select></label><label>Сортировка<select id="sort"><option value="totalClicks">По переходам</option><option value="uniqueClicks">По посетителям</option><option value="actionEvents">По открытиям</option><option value="label">По названию</option></select></label><button id="matrix-full" type="button" aria-pressed="false" aria-controls="links" disabled>Все показатели</button><button id="subgroups-toggle" type="button" aria-expanded="false" aria-controls="subgroups-panel" disabled>Подгруппы</button><button id="hidden-links" type="button" aria-expanded="false" aria-controls="hidden-links-panel" hidden>Скрытые</button><button id="budget-toggle" type="button" aria-expanded="false" aria-controls="budget-panel" disabled>Бюджет</button></div><form id="period-form" class="period-form" hidden>
  <fieldset id="period-month" hidden disabled>
    <label>Месяц<select id="period-month-number" required></select></label>
    <label>Год<input id="period-year" type="number" min="1" max="9999" step="1" required></label>
  </fieldset>
  <fieldset id="period-range" hidden disabled>
    <label>С<input id="period-from" type="date" required></label>
    <label>По<input id="period-to" type="date" required></label>
  </fieldset>
  <button type="submit">Применить</button>
</form>
<section id="budget-panel" class="budget-panel" hidden aria-labelledby="budget-title">
  <h2 id="budget-title">Расходы по ссылкам</h2>
  <form id="budget-form">
    <label id="budget-single-link">Ссылка<select id="budget-link" required></select></label>
    <label class="budget-split-toggle"><input id="budget-split" type="checkbox"> Разделить между ссылками</label>
    <fieldset id="budget-split-links" hidden disabled><legend>Выбери ссылки</legend></fieldset>
    <label>С<input id="budget-from" type="date" required></label>
    <label>По<input id="budget-to" type="date" required></label>
    <label>Потрачено, ₽<input id="budget-amount" type="number" min="0" step="0.01" inputmode="decimal" required></label>
    <button type="submit">Сохранить</button>
  </form>
  <p id="budget-message" role="status"></p>
  <div id="budget-gaps"></div>
  <div id="budget-records"></div>
  <small>Записи сохраняются в этом браузере. Если расходов не было, можно записать 0 ₽.</small>
</section>
<div id="hidden-links-panel" hidden></div>
<section id="subgroups-panel" class="budget-panel" aria-labelledby="subgroups-title" hidden>
  <h2 id="subgroups-title">Подгруппы ссылок</h2>
  <form id="subgroups-form">
    <fieldset id="subgroups-links"><legend>Выбери ссылки</legend></fieldset>
    <div class="subgroups-actions">
      <label>Подгруппа<select id="subgroup-select"></select></label>
      <label id="subgroup-new" hidden>Название подгруппы<input id="subgroup-name" type="text" maxlength="60"></label>
      <button type="submit" value="assign">Сохранить</button>
      <button type="submit" value="remove">Убрать из подгруппы</button>
    </div>
  </form>
  <p id="subgroups-message" role="status"></p>
</section>
<section id="links"></section></main><script src="./app-link-stats.js?v=20261123-budget-split" defer></script></body></html>
